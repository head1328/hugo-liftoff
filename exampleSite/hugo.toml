baseURL = "https://hugo-liftoff.kevinhorst.de/"
title = "Liftoff"
theme = "liftoff"
defaultContentLanguage = "en"
defaultContentLanguageInSubdir = true
enableRobotsTXT = true
enableEmoji = false

[pagination]
  pagerSize = 6

[params]
  description = "A Hugo theme for product-landing, docs, articles and showcase sites."
  tagline = "Minimal, expressive product sites, ready to ship with Hugo."
  copyrightOwner = "ACME"
  copyrightSuffix = "All rights reserved."

[params.repo]
  host  = "codeberg"
  owner = "head1328"
  name  = "hugo-liftoff"

[params.footer]
  address = """
ACME
Anytown, Germany
[hello@acme.example](mailto:hello@acme.example)
"""

[[params.social]]
  icon = "simple-icons:codeberg"
  name = "Codeberg"
  url  = "https://codeberg.org/head1328"

[[params.social]]
  icon = "simple-icons:mastodon"
  name = "Mastodon"
  url  = "https://chaos.social/@head1328"

[[params.social]]
  icon = "mdi:rss"
  name = "RSS"
  url  = "/index.xml"

[languages]
  [languages.en]
    label = "English"
    locale = "en"
    weight = 1
    title = "Liftoff"

  [languages.de]
    label = "Deutsch"
    locale = "de"
    weight = 2
    title = "Liftoff"
    [languages.de.params]
      description = "Ein Hugo-Theme für Produkt-Landingpages, Docs, Artikel und Showcase."
      tagline = "Minimal, ausdrucksstark, startklar. Produktseiten mit Hugo."
      copyrightSuffix = "Alle Rechte vorbehalten."

