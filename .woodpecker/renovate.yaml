when:
  - event: cron
    cron: renovate
  - event: manual

skip_clone: true

steps:
  - name: renovate
    image: renovate/renovate:44.239.1
    environment:
      RENOVATE_PLATFORM: forgejo
      RENOVATE_ENDPOINT: https://codeberg.org
      RENOVATE_REPOSITORIES: head1328/hugo-liftoff
      LOG_LEVEL: info
      RENOVATE_TOKEN:
        from_secret: renovate_token
      # Avoids the 60 req/h anonymous limit for github-releases/github-tags lookups.
      GITHUB_COM_TOKEN:
        from_secret: github_token
