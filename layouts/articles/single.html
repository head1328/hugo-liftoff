{{ define "main" }}
  <article class="article">
    <header class="article__header">
      <h1 class="article__title">{{ .Title }}</h1>
      <div class="article__meta">
        <time datetime="{{ .Date.Format "2006-01-02" }}">{{ time.Format ":date_long" .Date }}</time>
        {{- with .Params.author }}<span>{{ . }}</span>{{ end }}
        {{- with .ReadingTime }}<span>{{ i18n "reading_time" (dict "Count" .) }}</span>{{ end }}
      </div>
    </header>
    <div class="article__body">
      {{ .Content }}
    </div>
    {{- with .GetTerms "tags" }}
      <div class="article__tags">
        {{- range . }}
          <a class="badge" href="{{ .RelPermalink }}">{{ .LinkTitle }}</a>
        {{- end }}
      </div>
    {{- end }}
  </article>
{{ end }}
